<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>터치 DJ 스테이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a fixed 1600×900 landscape "booth" scaled to fit the screen (built for a 27" 16:9 touch display).
   Header on top; below it deck A | centre column (waveform tower over the mixer) | deck B, so each deck gets the full height for a large record.
   Deliberately single dark theme: it is a stage instrument. */
:root{
  --bg:#0f0b1a; --panel:#181325; --panel2:#221b35; --panel3:#2c2444; --line:#33294d; --groove:#1a1530; --groove2:#120e1f;
  --fg:#efeaff; --muted:#8f86ad;
  --a:#ffa94d; --a2:#ffd7a3; --a-dim:#5e4126; --b:#4fe3d6; --b2:#c0f6f0; --b-dim:#1f5653;
  --hot:#ff5d8f; --ok:#8be38f; --loopbg:#ffe0662b; --loopln:#ffe066; --dim:rgba(24,19,37,.55); --bar:#ff3b4f;
  --f-disp:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.fit{position:fixed;inset:0;padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;padding:14px;
  display:grid;grid-template-rows:52px 1fr;gap:12px;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.rot{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:var(--muted);font-size:13px;padding:0 16px}

/* header */
.top{display:flex;align-items:center;gap:14px;min-width:0}
.brand{font-family:var(--f-disp);font-weight:700;font-size:22px;letter-spacing:.16em;white-space:nowrap}
.brand b{color:var(--a)} .brand i{font-style:normal;color:var(--b)} .brand small{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-left:6px}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap;max-width:560px;overflow:hidden;text-overflow:ellipsis}
.chip.rb{color:var(--fg);border-color:var(--hot)}
.chip i{width:8px;height:8px;border-radius:4px;background:var(--muted);flex:none}
.chip.rb i{background:var(--hot)}
.grow{flex:1}
.clock{font-family:var(--f-mono);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.hb{height:40px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.08em;white-space:nowrap}
.hb.pri{background:var(--fg);color:var(--bg);border-color:var(--fg)}
label.hb{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.hb:active{background:var(--panel3)}

/* waveform tower */
.waves{display:grid;grid-template-rows:118px 22px 30px 22px 118px;gap:6px;flex:none}
.center{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.center .mixer{flex:1}
.wv,.ov{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ov canvas{display:block;width:100%;height:100%}
.wv .wc{display:block;width:100%;height:100%}
.wv .past{position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--dim);pointer-events:none}
.wv .ph{position:absolute;left:calc(50% - 1px);top:0;bottom:0;width:2px;background:var(--fg);pointer-events:none}
.ov .opast{position:absolute;inset:0;background:var(--dim);transform-origin:0 0;transform:scaleX(0);will-change:transform;pointer-events:none}
.ov .oph{position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--fg);will-change:transform;pointer-events:none}
.wv{cursor:grab}
.wl{position:absolute;left:10px;top:6px;font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.12em;pointer-events:none}
.a .wl{color:var(--a)} .b .wl{color:var(--b)}
.phase{display:grid;grid-template-columns:14px 1fr 236px 1fr 14px;align-items:center;gap:8px}
.pl{font-family:var(--f-disp);font-weight:700;text-align:center}
.pl.a{color:var(--a)} .pl.b{color:var(--b)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:14px}
.segs i{border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.segs.a i.on{background:var(--a);border-color:var(--a)} .segs.b i.on{background:var(--b);border-color:var(--b)}
.segs i:first-child{border-width:2px}
.pmid{display:flex;align-items:center;gap:10px}
.zb{width:36px;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.needle{position:relative;flex:1;height:22px;border-radius:11px;background:var(--panel);border:1px solid var(--line)}
.needle::before{content:"";position:absolute;left:calc(50% - 1px);top:3px;bottom:3px;width:2px;background:var(--muted)}
.needle .dot{position:absolute;top:3px;width:30px;height:14px;border-radius:7px;margin-left:-15px;background:var(--muted);left:50%}
.needle.match .dot{background:var(--ok)}
.needle .tx{position:absolute;right:10px;top:2px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.needle .tx2{position:absolute;left:10px;top:2px;font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--muted)}

/* console */
.console{position:relative;display:grid;grid-template-columns:1fr 520px 1fr;gap:12px;min-height:0}
.deck{--c:var(--a);--c2:var(--a2);--cd:var(--a-dim);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;
  display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-width:0;min-height:0}
.deck.b{--c:var(--b);--c2:var(--b2);--cd:var(--b-dim)}
.dhead{display:flex;gap:12px;align-items:stretch;min-width:0}
.tinfo{flex:1;min-width:0;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.tname{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tart{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
.dstat{display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.rem{font-size:24px;font-weight:700}
.el{font-size:12px;color:var(--muted)}
.deck.warn .rem{color:var(--hot)}
.bpmb{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;min-width:84px}
.bpmv{font-size:24px;font-weight:700;color:var(--c)}
.pv{font-size:12px;color:var(--muted)}
.mst{font-family:var(--f-disp);font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--bg);background:var(--c);border-radius:4px;padding:2px 6px;margin-top:3px}

.dmain{display:flex;gap:10px;align-items:center;justify-content:space-between;min-height:0}
.deck.b .dmain{flex-direction:row-reverse}
.pitch{width:36px;height:448px;display:flex;flex-direction:column;align-items:center;gap:6px}
.plab{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.jog{width:448px;height:448px;border-radius:50%;position:relative;touch-action:none;cursor:grab;flex:none}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--panel2)}
.rsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rsvg circle{fill:none;stroke-width:2.2}
.rsvg .rbg{stroke:var(--panel3)}
.rsvg .rfg{stroke:var(--c);stroke-dasharray:100 100;stroke-dashoffset:100}
.deck.warn.blink .rsvg .rfg{stroke:var(--hot)}
.jog.bend .rsvg .rbg{stroke:var(--cd)}
/* the record: grooves are painted once into a canvas, the light reflection is a fixed overlay,
   and only the paper label in the middle rotates */
.vinyl{position:absolute;inset:4.6%;border-radius:50%;overflow:hidden;background:#09080c;box-shadow:0 0 0 1px #000}
.vc{position:absolute;inset:0;width:100%;height:100%;display:block}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 205deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.12) 20deg,rgba(255,255,255,0) 44deg,rgba(255,255,255,0) 180deg,rgba(255,255,255,.08) 200deg,rgba(255,255,255,0) 224deg,rgba(255,255,255,0) 360deg)}
.label{position:absolute;inset:33.5%;border-radius:50%;will-change:transform;color:#140f20;text-align:center;
  background:radial-gradient(circle,var(--c2) 0 7%,var(--c) 7.5% 92%,rgba(0,0,0,.25) 93% 100%)}
.lbl-top{position:absolute;left:0;right:0;top:15%;font-family:var(--f-disp);font-size:9px;font-weight:700;letter-spacing:.16em;opacity:.7}
.lbl-big{position:absolute;left:0;right:0;top:25%;font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:.1em}
.lbl-bot{position:absolute;left:13%;right:13%;top:57%;display:flex;flex-direction:column;align-items:center;gap:2px}
.lbl-bot b{font-size:11.5px;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:keep-all}
.lbl-bot span{font-family:var(--f-mono);font-size:9.5px;opacity:.75}
.hole{position:absolute;left:calc(50% - 5px);top:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#0b0a0e;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.jog.scr .vinyl{box-shadow:0 0 0 3px var(--c)}
/* tonearm: fixed pivot outside the record; it sweeps inward as the track plays (start = outer groove) */
.arm{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.deck.b .arm{transform:scaleX(-1)}
.arm .tube{stroke:#cfcadb;stroke-width:6;stroke-linecap:round;fill:none}
.arm .shadow{stroke:rgba(0,0,0,.45);stroke-width:8;stroke-linecap:round;fill:none}
.arm .base{fill:var(--panel3);stroke:var(--line);stroke-width:2}
.arm .hub2{fill:#8d87a0}
.arm .cw{fill:#3d3554;stroke:#4a4166;stroke-width:1.5}
.arm .head{fill:var(--c)}
.arm .stylus{fill:#efeaff}
.needle .tx2{display:none}

.ctrl{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{height:30px;padding:0 12px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-body);font-size:12px;letter-spacing:0;color:var(--muted)}
.mini.on{border-color:var(--c);color:var(--c)}
.mini.arm{background:var(--hot);border-color:var(--hot);color:var(--bg)}
.hots{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.hc{height:58px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-disp);font-weight:700;font-size:16px;color:var(--muted);position:relative;touch-action:none}
.hc.set{background:var(--hcol);border-color:var(--hcol);color:var(--bg)}
.hc.set.lp::after{content:"↻";position:absolute;right:4px;top:1px;font-size:11px}
.deck.del .hc.set{outline:2px dashed var(--hot);outline-offset:-4px}
.loops{display:grid;grid-template-columns:48px repeat(6,1fr);gap:6px;align-items:center}
.ll{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--muted)}
.lp{height:46px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-mono);font-weight:700;font-size:15px;touch-action:none}
.lp.on{background:var(--loopln);border-color:var(--loopln);color:var(--bg)}
.lp.ex{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;color:var(--muted)}

.transport{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:8px}
.tbtn{height:76px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-disp);font-weight:700;letter-spacing:.12em;font-size:16px;touch-action:none}
.tbtn.cue{border-color:var(--c);color:var(--c)}
.tbtn.play{font-size:26px}
.tbtn.play.on,.tbtn.sync.on{background:var(--c);color:var(--bg);border-color:var(--c)}
.tbtn.flash,.hc.flash,.lp.flash{background:var(--fg);color:var(--bg)}

.vslider{position:relative;width:44px;flex:1;touch-action:none;cursor:ns-resize}
.vslider .tr{position:absolute;left:calc(50% - 3px);width:6px;top:0;bottom:0;border-radius:3px;background:var(--line)}
.vslider .tr::before{content:"";position:absolute;left:-9px;right:-9px;top:50%;height:1px;background:var(--muted)}
.vslider.fader .tr::before{display:none}
.thumb{position:absolute;left:0;right:0;height:30px;border-radius:7px;background:var(--panel3);border:2px solid var(--c);top:calc((1 - var(--v,.5)) * (100% - 30px))}
.thumb::after{content:"";position:absolute;left:6px;right:6px;top:calc(50% - 1px);height:2px;background:var(--fg)}
.pval{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* mixer */
.mixer{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
.ch{--c:var(--a);display:grid;grid-template-columns:auto 1fr;gap:14px;min-height:0}
.ch.b .knobs{order:2}
.ch.b{grid-template-columns:1fr auto}
.ch.b{--c:var(--b)}
.knobs{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 14px;touch-action:none;cursor:ns-resize}
.kd{width:54px;height:54px;border-radius:50%;background:var(--panel3);border:1px solid var(--line);position:relative;transform:rotate(var(--r,0deg))}
.kd i{position:absolute;left:calc(50% - 2px);top:5px;width:4px;height:18px;border-radius:2px;background:var(--c)}
.knob span{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.knob.filt .kd{border-color:var(--c)}
.frow{display:flex;gap:12px;min-height:0;align-items:stretch;justify-content:center}
.ch.b .frow{flex-direction:row-reverse}
.frow .vslider{flex:0 0 44px}
.meter{width:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0;background:linear-gradient(to top,var(--c) 0 68%,var(--hot) 94%)}
.meter u{position:absolute;inset:0;background:var(--line);will-change:transform}
.chl{display:none}
.xfw{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700}
.xfw .la{color:var(--a)} .xfw .lb{color:var(--b)}
.hslider{--c:var(--fg);position:relative;flex:1;height:44px;touch-action:none;cursor:ew-resize}
.hslider .tr{position:absolute;top:calc(50% - 3px);height:6px;left:0;right:0;border-radius:3px;background:linear-gradient(90deg,var(--a-dim),var(--line) 50%,var(--b-dim))}
.hslider .thumb{top:7px;bottom:7px;height:auto;right:auto;width:34px;left:calc(var(--v,.5) * (100% - 34px))}
.hslider .thumb::after{left:calc(50% - 1px);right:auto;width:2px;top:5px;bottom:5px;height:auto}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{height:56px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none}
.pad b{font-weight:600;font-size:14px}
.pad small{font-family:var(--f-disp);font-size:9px;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.pad.on{background:var(--hot);border-color:var(--hot);color:var(--bg)} .pad.on small{color:var(--bg)}

/* library browser */
.lib{position:absolute;inset:0;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:300px 1fr;overflow:hidden;touch-action:pan-y}
.lside{background:var(--panel2);border-right:1px solid var(--line);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;touch-action:pan-y}
.lh{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:10px 10px 4px}
.lv{text-align:left;min-height:44px;padding:8px 12px;border-radius:10px;background:none;border:1px solid transparent;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.lv span{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.lv.on{background:var(--panel3);border-color:var(--line)}
.lf{padding:8px 12px;font-size:13px;color:var(--muted)}
.lmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.lbar{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.lbar input{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:0 14px;font-size:15px}
.lstat{padding:8px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.lstat b{color:var(--fg);font-weight:600}
.rows{flex:1;overflow-y:auto;touch-action:pan-y}
.row{display:grid;grid-template-columns:1fr 92px 100px 56px 64px 64px;gap:10px;align-items:center;padding:6px 12px 6px 16px;border-bottom:1px solid var(--line);min-height:58px}
.row.miss{opacity:.45}
.rt{min-width:0}
.rt b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ld{height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.06em}
.ld.a{color:var(--a)} .ld.b{color:var(--b)}
.ld.a.cur{background:var(--a);color:var(--bg);border-color:var(--a)} .ld.b.cur{background:var(--b);color:var(--bg);border-color:var(--b)}
.ld:disabled{opacity:.4}
.empty{padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.7;max-width:62ch}
.empty code{font-family:var(--f-mono);font-size:12.5px;color:var(--fg);white-space:nowrap}
.deck,.mixer,.wv,.ov,.spec{contain:layout paint}
.hb.on{border-color:var(--ok);color:var(--ok)}
/* settings popover */
.sett{position:absolute;right:14px;top:72px;z-index:9;width:460px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.sh{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--muted)}
.srow{display:flex;gap:14px;align-items:center;justify-content:space-between}
.srow.col{flex-direction:column;align-items:stretch}
.srow b{display:block;font-weight:600;font-size:15px}
.srow span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.seg button{height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px}
.seg button.on{background:var(--ok);border-color:var(--ok);color:var(--bg)}

.ptabs button{border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:13px;color:var(--muted);padding:0}

.rn.ok{color:var(--ok)}

.row.played .rt b{color:var(--muted)}

.dg{display:flex;gap:6px;align-items:center;height:30px;padding:0 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12.5px}
.dg span{color:var(--muted)} .dg b{font-family:var(--f-mono);font-weight:700}
.dg.ok b{color:var(--ok)} .dg.warn b{color:var(--loopln)} .dg.bad b{color:var(--hot)}

.dnote::before{content:"! ";color:var(--loopln);font-weight:700}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

/* ================= stage fit ================= */
const fit=$('fit'), stage=$('stage'); let S=1, fitN=0;

  stage.style.top=(portrait?pt+40:pt+(H-900*S)/2)+'px';

}
addEventListener('resize',doFit); doFit();

/* ================= markup ================= */
const deckHTML=i=>`
<section class="deck ${i?'b':'a'}" id="deck${i}">
  <div class="dhead">
    <button class="tinfo" id="ti${i}" aria-label="덱 ${LET[i]} 곡 고르기"><span class="tname" id="name${i}">—</span><span class="tart" id="art${i}"></span></button>
    <div class="dstat">
      <div class="tm"><span class="rem" id="rem${i}">-0:00</span><span class="el" id="el${i}">0:00</span></div>
      <div class="bpmb"><span class="bpmv" id="bpm${i}">—</span><span class="pv" id="pv${i}">0.0%</span><span class="mst" id="mst${i}" hidden>MASTER</span></div>
    </div>
  </div>
  <div class="dmain">
    <div class="pitch"><span class="plab">PITCH</span><div class="vslider" id="pitch${i}" tabindex="0" aria-label="${LET[i]} 피치"><div class="tr"></div><div class="thumb"></div></div><span class="pval">±12%</span></div>
    <div class="jog" id="jog${i}">
      <div class="ring"><svg class="rsvg" viewBox="0 0 100 100"><circle class="rbg" cx="50" cy="50" r="48.9"/><circle class="rfg" id="rfg${i}" cx="50" cy="50" r="48.9" pathLength="100"/></svg></div>
      <div class="vinyl"><canvas class="vc" id="vc${i}"></canvas><div class="sheen"></div>
        <div class="label" id="plat${i}"><div class="lbl-top">SIDE ${LET[i]} · 33⅓ RPM</div><div class="lbl-big">TOUCH DJ</div><div class="lbl-bot"><b id="lt${i}">—</b><span id="hubk${i}"></span></div><i class="hole"></i></div>
      </div>

        <g id="arm${i}" transform="rotate(-5 424 28)">

          <rect class="cw" x="413" y="-6" width="22" height="22" rx="5"/>
          <path class="tube" d="M424 28 L424 212"/>
          <rect class="head" x="413" y="206" width="22" height="40" rx="4"/>
          <circle class="stylus" cx="424" cy="246" r="3"/>

        <circle class="hub2" cx="424" cy="28" r="8"/>
      </svg>
    </div>
  </div>
  <div class="ctrl">
    <div class="crow">
      <div class="ptabs" id="pt${i}"><button data-m="hot" class="on">핫큐</button><button data-m="jump">점프</button><button data-m="roll">롤</button><button data-m="del" class="x" id="hdel${i}" aria-label="핫큐 지우기">✕</button></div>
      <button class="mini on" id="qz${i}" aria-label="퀀타이즈">Q 스냅</button>
    </div>

    <div class="loops" id="loops${i}"><span class="ll">LOOP</span>${[1,2,4,8,16].map(n=>`<button class="lp" data-n="${n}">${n}</button>`).join('')}<button class="lp ex" data-n="0">OFF</button></div>
    <div class="transport">
      <button class="tbtn cue" id="cue${i}">CUE</button>
      <button class="tbtn play" id="play${i}" aria-label="재생">▶</button>
      <button class="tbtn sync" id="sync${i}" aria-label="비트싱크">SYNC</button>
    </div>
  </div>
</section>`;
const knob=(i,k,lab,cls='')=>`<div class="knob ${cls}" id="k${i}${k}" tabindex="0" aria-label="${LET[i]} ${lab}"><div class="kd"><i></i></div><span>${lab}</span></div>`;
const chHTML=i=>`<div class="ch ${i?'b':'a'}">
  <div class="knobs">${knob(i,'hi','HI')}${knob(i,'mid','MID')}${knob(i,'low','LOW')}${knob(i,'filt','FILTER','filt')}</div>
  <div class="frow"><div class="meter"><i></i><u id="met${i}"></u></div><div class="vslider fader" id="vol${i}" tabindex="0" aria-label="${LET[i]} 볼륨"><div class="tr"></div><div class="thumb"></div></div></div>
  <div class="chl">${LET[i]}</div></div>`;
$('console').insertAdjacentHTML('beforeend',deckHTML(0)+`
<section class="mixer">
  <div class="chs">${chHTML(0)}${chHTML(1)}</div>
  <div class="xfw"><span class="la">A</span><div class="hslider" id="xf" tabindex="0" aria-label="크로스페이더"><div class="tr"></div><div class="thumb"></div></div><span class="lb">B</span></div>
  <div class="pads">
    <button class="pad" id="fxHorn"><b>에어혼</b><small>AIR HORN</small></button>
    <button class="pad" id="fxRise"><b>라이저</b><small>RISER</small></button>
    <button class="pad" id="fxDown"><b>다운</b><small>DOWNLIFT</small></button>
    <button class="pad" id="fxEcho"><b>에코</b><small>HOLD</small></button>
  </div>
</section>`+deckHTML(1));
{ const center=document.createElement('div'), mx=document.querySelector('.mixer'); center.className='center'; mx.before(center); center.append($('waves'),mx); }
/* paint the record once: fine grooves, darker bands between songs, smooth run-out and rim */
function drawVinyl(cv){
  const N=Math.round(412*Math.min(2,Math.max(1,(window.devicePixelRatio||1)*S))); cv.width=cv.height=N;
  const g=cv.getContext('2d'), c=N/2, R=N/2; let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  g.fillStyle='#09080c'; g.beginPath(); g.arc(c,c,R,0,7); g.fill();
  const runout=R*.395, lead=R*.955, gaps=[.18,.37,.55,.74].map(f=>runout+(lead-runout)*f);
  g.lineWidth=Math.max(1,N/800);
  for(let r=runout;r<lead;r+=N/640){
    const gap=gaps.some(x=>Math.abs(r-x)<N*.0045), l=gap?4.5:12+rnd()*10;
    g.strokeStyle='hsl(258,7%,'+l.toFixed(1)+'%)'; g.beginPath(); g.arc(c,c,r,0,7); g.stroke();
  }
  g.lineWidth=R-lead; g.strokeStyle='#1a1820'; g.beginPath(); g.arc(c,c,(R+lead)/2,0,7); g.stroke();
  g.lineWidth=Math.max(1,N/900); g.strokeStyle='#15131a';
  for(let r=R*.345;r<runout;r+=N/90){ g.beginPath(); g.arc(c,c,r,0,7); g.stroke(); }
}
[0,1].forEach(i=>drawVinyl($('vc'+i)));

/* ================= audio engine ================= */
const mkDeck=i=>({i,buffer:null,wave:null,ovc:null,dur:0,grid:null,bpm:null,approx:false,wrap:false,title:'',artist:'',key:'',track:null,
  offset:0,startedAt:0,playing:false,src:null,pitch:0,bend:0,cue:0,hot:Array(8).fill(null),
  loopOn:false,lin:0,lout:0,q:true,del:false,mode:'hot',roll:null,nodes:null,lvl:0,token:0,ver:0,sync:false,hold:false,snapT:0});
const decks=[mkDeck(0),mkDeck(1)];
const mix={eq:[[0,0,0],[0,0,0]],filt:[0,0],vol:[.85,.85],xf:.5};
let ctx=null,master,comp,echoSend,echoDelay,noiseBuf,mAn,mBins;

function ensureCtx(){
  if(ctx){ if(ctx.state==='suspended') ctx.resume(); return ctx; }
  const AC=window.AudioContext||window.webkitAudioContext;
  try{ ctx=new AC({latencyHint:'interactive'}); }catch(e){ ctx=new AC(); }
  comp=ctx.createDynamicsCompressor(); comp.threshold.value=-8; comp.ratio.value=4; comp.connect(ctx.destination);
  master=ctx.createGain(); master.gain.value=.9; master.connect(comp);
  echoSend=ctx.createGain(); echoSend.gain.value=0; echoDelay=ctx.createDelay(2); echoDelay.delayTime.value=.36;
  const fb=ctx.createGain(), ef=ctx.createBiquadFilter(); fb.gain.value=.5; ef.type='highpass'; ef.frequency.value=350;
  master.connect(echoSend); echoSend.connect(echoDelay); echoDelay.connect(ef); ef.connect(fb); fb.connect(echoDelay); ef.connect(comp);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const nd=noiseBuf.getChannelData(0); for(let k=0;k<nd.length;k++) nd[k]=Math.random()*2-1;
  decks.forEach(buildChain); applyMix();
  return ctx;
}
function buildChain(d){
  const n={}, bq=(type,f,q)=>{const b=ctx.createBiquadFilter();b.type=type;b.frequency.value=f;if(q)b.Q.value=q;return b;};
  n.lo=bq('lowshelf',220); n.mid=bq('peaking',1100,.8); n.hi=bq('highshelf',3800); n.hp=bq('highpass',20,.9); n.lp=bq('lowpass',20000,.9);
  n.fader=ctx.createGain(); n.xf=ctx.createGain(); n.an=ctx.createAnalyser(); n.an.fftSize=512; n.buf=new Float32Array(512);
  n.lo.connect(n.mid); n.mid.connect(n.hi); n.hi.connect(n.hp); n.hp.connect(n.lp); n.lp.connect(n.fader); n.fader.connect(n.xf); n.xf.connect(master); n.fader.connect(n.an);
  d.nodes=n;
}
const eqDb=v=>v<0?v*26:v*6;
function applyMix(){
  if(!ctx) return; const t=ctx.currentTime, x=mix.xf;
  const g=[x<=.5?1:Math.cos((x-.5)*Math.PI), x>=.5?1:Math.cos((.5-x)*Math.PI)];
  decks.forEach((d,i)=>{ const n=d.nodes, f=mix.filt[i];
    n.hi.gain.setTargetAtTime(eqDb(mix.eq[i][0]),t,.01); n.mid.gain.setTargetAtTime(eqDb(mix.eq[i][1]),t,.01); n.lo.gain.setTargetAtTime(eqDb(mix.eq[i][2]),t,.01);
    n.lp.frequency.setTargetAtTime(f<-.02?20000*Math.pow(180/20000,-f):20000,t,.015);
    n.hp.frequency.setTargetAtTime(f>.02?20*Math.pow(5000/20,f):20,t,.015);
    n.fader.gain.setTargetAtTime(mix.vol[i]*mix.vol[i],t,.01); n.xf.gain.setTargetAtTime(g[i],t,.01); });
}

/* ---- transport ---- */
const rate=d=>(1+d.pitch)*(1+d.bend);
function pos(d){
  if(!d.buffer) return 0;
  if(!d.playing||!ctx) return d.offset;
  let p=d.offset+(ctx.currentTime-d.startedAt)*rate(d);
  if(d.loopOn){ if(p>=d.lout) p=d.lin+((p-d.lin)%(d.lout-d.lin)); return p; }
  return d.wrap?p%d.dur:Math.min(p,d.dur);
}
/* what the listener hears right now: the playhead minus output delay (auto + manual Bluetooth offset) */
function vpos(d){
  let p=pos(d);
  if(d.playing&&ctx){ p-=((ctx.outputLatency||0)+VLAT/1000)*rate(d);
    if(d.loopOn&&p<d.lin) p+=d.lout-d.lin; else if(d.wrap&&p<0) p+=d.dur; else if(p<0) p=0; }
  return p;
}
function rebase(d){ if(d.playing){ d.offset=pos(d); d.startedAt=ctx.currentTime; } }
function stopSrc(d){ if(d.src){ d.src.onended=null; try{d.src.stop();}catch(e){} d.src=null; } }
function startSrc(d){
  const s=ctx.createBufferSource(); s.buffer=d.buffer; s.playbackRate.value=rate(d);
  s.loop=d.loopOn||d.wrap; if(d.loopOn){ s.loopStart=d.lin; s.loopEnd=d.lout; }
  s.connect(d.nodes.lo); s.start(0,clamp(d.offset,0,d.dur-.01));
  d.src=s; d.startedAt=ctx.currentTime; d.playing=true;
  if(!s.loop) s.onended=()=>{ if(d.src===s){ d.src=null; d.playing=false; d.offset=d.dur; uiTransport(d); } };
}
function play(d){
  if(!d.buffer) return; ensureCtx(); if(!d.wrap&&!d.loopOn&&d.offset>=d.dur-.05) d.offset=0;
  const o=decks[1-d.i];
  if(!d.playing&&d.sync&&o.playing&&d.grid&&o.grid){ syncTempo(d,o); const e=phaseErr(d,o);
    if(e!=null){ let np=d.offset+e; if(d.wrap) np=((np%d.dur)+d.dur)%d.dur; if(!(d.loopOn&&(np<d.lin||np>=d.lout))) d.offset=clamp(np,0,d.dur-.01); } }
  if(!d.playing){ startSrc(d); if(d.track) d.track.played=true; } uiTransport(d);
}
/* ---- beat sync ---- */
function tempoRatio(d,o){ let r=o.bpm*(1+o.pitch)/d.bpm; while(r>1.5) r/=2; while(r<.75) r*=2; return r; }
function syncTempo(d,o){ const np=tempoRatio(d,o)-1; if(Math.abs(np-d.pitch)>1e-5){ changeRate(d,()=>d.pitch=np); uiPitch(d); } }
function phaseErr(d,o){
  const po=pos(o), io=beatAt(o,po), p=pos(d), id=beatAt(d,p); if(io<0||id<0) return null;
  const fo=(po-o.grid.t[io])/beatLen(o,io), fd=(p-d.grid.t[id])/beatLen(d,id);
  let df=fo-fd; df-=Math.round(df); return df*beatLen(d,id);
}
function syncPhase(d,o,hard){
  if(!d.grid||!o.grid) return; const e=phaseErr(d,o); if(e==null) return;
  const now=performance.now();
  if(hard||(Math.abs(e)>.08&&now-d.snapT>1000)){ d.snapT=now; const np=pos(d)+e; if(!(d.loopOn&&(np<d.lin||np>=d.lout))){ if(d.bend) changeRate(d,()=>d.bend=0); seek(d,np); } return; }
  let b=clamp(e*1.5,-.04,.04); if(Math.abs(b)<.0008) b=0;
  if(Math.abs(b-d.bend)>.0008||(b===0&&d.bend!==0)) changeRate(d,()=>d.bend=b);

function syncStep(){

/* ---- pad modes: hot cue / beat jump / roll (slip loop) ---- */

const ROLLS=[1/16,1/8,1/4,1/2,1,2,4,8], ROLLL=['1/16','1/8','1/4','1/2','1','2','4','8'];

function hotPress(d,k,btn){

async function decodeFile(file){

  catch(e){ ensureCtx(); return await ctx.decodeAudioData(await file.arrayBuffer()); }

function bandWave(buf){
  const sr=buf.sampleRate, n=Math.ceil(buf.duration*WR), per=sr/WR;
  const c0=buf.getChannelData(0), c1=buf.numberOfChannels>1?buf.getChannelData(1):c0;

  let l1=0,l2=0; const mx=[1e-6,1e-6,1e-6];

    const s=Math.floor(b*per), e=Math.min(buf.length,Math.floor((b+1)*per)); let m0=0,m1=0,m2=0;
    for(let j=s;j<e;j++){ const x=(c0[j]+c1[j])*.5; l1+=a1*(x-l1); l2+=a2*(x-l2);
      const lo=l1<0?-l1:l1, mi=l2-l1<0?l1-l2:l2-l1, hi=x-l2<0?l2-x:x-l2; if(lo>m0)m0=lo; if(mi>m1)m1=mi; if(hi>m2)m2=hi; }
    raw[b*3]=m0; raw[b*3+1]=m1; raw[b*3+2]=m2; if(m0>mx[0])mx[0]=m0; if(m1>mx[1])mx[1]=m1; if(m2>mx[2])mx[2]=m2;
  }

  for(let k=0;k<n*3;k++) out[k]=Math.min(255,raw[k]/mx[k%3]*w[k%3]*255);
  return out;
}
/* Tempo detection for files without rekordbox data.
   Onset envelope at 200 frames/s (kick band weighted), then a Fourier comb: |Σ onset·e^{iωt}| per tempo.
   Coarse 0.25 BPM over 85–175 with a mild prior around 124, refined to 0.01 BPM over up to 5 minutes;
   the phase of the same sum gives the beat position, and the strongest of four beats gives the downbeat. */
function estimateGrid(buf){
  const sr=buf.sampleRate, c0=buf.getChannelData(0), c1=buf.numberOfChannels>1?buf.getChannelData(1):c0;
  const hop=Math.max(1,Math.round(sr/200)), FR=sr/hop, F=Math.min(Math.floor(buf.length/hop),Math.floor(FR*300));
  if(F<FR*8) return null;
  const al=1-Math.exp(-2*Math.PI*160/sr), on=new Float32Array(F), low=new Float32Array(F), bb=new Float32Array(F);
  // per-frame energy, then a centred 20 ms window so low-frequency ripple does not create fake onsets
  const EL=new Float32Array(F), EB=new Float32Array(F); let lp=0;

    for(let j=s0;j<e0;j++){ const x=(c0[j]+c1[j])*.5; lp+=al*(x-lp); eL+=lp*lp; eB+=x*x; } EL[f]=eL; EB[f]=eB; }
  const win=(E,f)=>Math.sqrt((E[f-1]||0)+E[f]+(E[f+1]||0)+(E[f+2]||0));
  let pL=0,pB=0;
  for(let f=0;f<F;f++){ const l=win(EL,f), b2=win(EB,f); low[f]=Math.max(0,l-pL); bb[f]=Math.max(0,b2-pB); on[f]=low[f]*2+bb[f]; pL=l; pB=b2; }
  // subtract a running mean (≈0.4 s) so sustained loud passages do not dominate
  const W=Math.round(FR*.4); let acc=0; const tmp=new Float32Array(F);
  for(let f=0;f<F;f++){ acc+=on[f]; if(f>=W) acc-=on[f-W]; tmp[f]=Math.max(0,on[f]-acc/Math.min(f+1,W)*1.2); }
  on.set(tmp);

    for(let f=0;f<n;f++){ const v=A[f]; if(v){ re+=v*c; im+=v*s; } const c2=c*cw-s*sw; s=s*cw+c*sw; c=c2;
      if((f&1023)===1023){ const m=Math.hypot(c,s); c/=m; s/=m; } }
    return {m:Math.hypot(re,im),re,im,w}; };
  const nC=Math.min(F,Math.floor(FR*120));
  let best=0,bm=-1;
  for(let bpm=85;bpm<=175;bpm+=.25){ const r=comb(bpm,nC), oct=Math.log2(bpm/124), m=(r.m+.5*comb(bpm*2,nC).m)*Math.exp(-oct*oct*2); if(m>bm){bm=m;best=bpm;} }
  let fine=best,fm=-1,fr=null;
  for(let bpm=best-.3;bpm<=best+.3001;bpm+=.01){ const r=comb(bpm,F); if(r.m>fm){fm=r.m;fine=bpm;fr=r;} }
  { const ri=Math.round(fine); if(Math.abs(fine-ri)<.05&&comb(ri,F).m>=fm*.998) fine=ri; }
  const r=comb(fine,F,bb), L=FR*60/fine;
  let ph=Math.atan2(r.im,r.re)/r.w; ph=((ph%L)+L)%L;
  // downbeat: which of the four beats carries the most kick energy
  const sums=[0,0,0,0];
  for(let k=0;ph+k*L<F-2;k++){ const f=Math.round(ph+k*L); sums[k%4]+=Math.max(low[f]||0,low[f+1]||0,low[f-1]||0); }
  const db=sums.indexOf(Math.max(...sums));
  return {bpm:fine,grid:makeGrid(fine,(ph+db*L)/FR,buf.duration)};
}

/* ================= rekordbox: ANLZ + export.pdb ================= */
const fourcc=(dv,p)=>String.fromCharCode(dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2),dv.getUint8(p+3));
function utf16be(dv,p,len){ let s=''; for(let k=0;k+1<len;k+=2){ const c=dv.getUint16(p+k); if(!c) break; s+=String.fromCharCode(c); } return s; }
function parseAnlz(ab){
  const dv=new DataView(ab), out={path:null,beats:null,hot:[],mem:[]};
  if(ab.byteLength<28||fourcc(dv,0)!=='PMAI') return out;

  while(p+12<=ab.byteLength){
    const tag=fourcc(dv,p), lh=dv.getUint32(p+4), lt=dv.getUint32(p+8); if(lt<12||p+lt>ab.byteLength) break;
    try{
      if(tag==='PPTH'){ out.path=utf16be(dv,p+16,dv.getUint32(p+12)); }
      else if(tag==='PQTZ'){ const n=dv.getUint32(p+20), t=new Float64Array(n), nn=new Uint8Array(n); let tempo=0;
        for(let k=0;k<n;k++){ const e=p+lh+k*8; nn[k]=dv.getUint16(e); if(!tempo) tempo=dv.getUint16(e+2); t[k]=dv.getUint32(e+4)/1000; }
        if(n>1) out.beats={t,n:nn,bpm:tempo/100}; }
      else if(tag==='PCOB'){ const n=dv.getUint16(p+18); let e=p+lh;
        for(let k=0;k<n&&e+40<=p+lt;k++){ if(fourcc(dv,e)!=='PCPT') break; const elt=dv.getUint32(e+8), hot=dv.getUint32(e+12), ty=dv.getUint8(e+28), tm=dv.getUint32(e+32), lp=dv.getUint32(e+36);
          if(tm!==0xffffffff){ const c={t:tm/1000,loop:ty===2&&lp!==0xffffffff&&lp>tm?(lp-tm)/1000:null}; if(hot>0) out.hot.push(Object.assign(c,{slot:hot-1})); else out.mem.push(c); }
          e+=elt||56; } }
      else if(tag==='PCO2'){ const n=dv.getUint16(p+16); let e=p+lh;
        for(let k=0;k<n&&e+32<=p+lt;k++){ if(fourcc(dv,e)!=='PCP2') break; const elt=dv.getUint32(e+8), hot=dv.getUint32(e+12), ty=dv.getUint8(e+16), tm=dv.getUint32(e+20), lp=dv.getUint32(e+24);
          let color=null;
          if(elt>=0x30){ const lc=dv.getUint32(e+0x28), cp=e+0x2c+lc; if(cp+4<=e+elt){ const r=dv.getUint8(cp+1),g=dv.getUint8(cp+2),b=dv.getUint8(cp+3); if(r|g|b) color='rgb('+r+','+g+','+b+')'; } }

    }catch(err){}
    p+=lt;
  }
  return out;
}
const td16=new TextDecoder('utf-16le'), td8=new TextDecoder('utf-8');
function dstr(dv,p){
  const b=dv.getUint8(p);
  if(b&1){ const len=(b>>1)-1; return len>0?td8.decode(new Uint8Array(dv.buffer,p+1,len)):''; }
  const len=dv.getUint16(p+1,true)-4; if(len<=0) return '';
  if(b===0x90) return td16.decode(new Uint8Array(dv.buffer,p+4,len)).replace(/\0+$/,'');
  if(b===0x40) return td8.decode(new Uint8Array(dv.buffer,p+4,len));

function parsePdb(ab){
  const dv=new DataView(ab), lenPage=dv.getUint32(4,true), nT=dv.getUint32(8,true), tables={};
  if(lenPage<512||lenPage>65536||nT>64) throw new Error('pdb');
  for(let k=0;k<nT;k++){ const o=28+k*16; tables[dv.getUint32(o,true)]={first:dv.getUint32(o+8,true),last:dv.getUint32(o+12,true)}; }
  function rows(type,fn){
    const t=tables[type]; if(!t) return; let p=t.first; const seen=new Set();
    while(!seen.has(p)){ seen.add(p); const base=p*lenPage; if(base+lenPage>ab.byteLength) break;
      const ptype=dv.getUint32(base+8,true), next=dv.getUint32(base+12,true), flags=dv.getUint8(base+0x1b);
      if(ptype===type&&(flags&0x40)===0){
        const small=dv.getUint8(base+0x18), large=dv.getUint16(base+0x22,true), n=(large>small&&large!==0x1fff)?large:small;
        const groups=n?Math.floor((n-1)/16)+1:0;
        for(let g=0;g<groups;g++){ const gb=base+lenPage-g*0x24, present=dv.getUint16(gb-4,true);
          for(let j=0;j<16;j++){ if(!((present>>j)&1)) continue; const rp=base+0x28+dv.getUint16(gb-6-2*j,true); try{fn(rp);}catch(e){} } }
      }
      if(p===t.last) break; p=next;
    }
  }
  const u32=o=>dv.getUint32(o,true), u16=o=>dv.getUint16(o,true);
  const artists=new Map(), keys=new Map(), tracks=[], lists=[], entries=[];
  rows(2,r=>{ const sub=u16(r); let ofs=dv.getUint8(r+9); if(sub===0x64) ofs=u16(r+10); artists.set(u32(r+4),dstr(dv,r+ofs)); });
  rows(5,r=>keys.set(u32(r),dstr(dv,r+8)));
  rows(0,r=>{ const so=k=>r+u16(r+0x5e+2*k);
    tracks.push({id:u32(r+0x48),title:dstr(dv,so(17)),artistId:u32(r+0x44),keyId:u32(r+0x20),bpm:u32(r+0x38)/100,dur:u16(r+0x54),path:dstr(dv,so(20)),anlzPath:dstr(dv,so(14)),fname:dstr(dv,so(19))}); });

  rows(8,r=>entries.push({idx:u32(r),track:u32(r+4),pl:u32(r+8)}));
  tracks.forEach(t=>{ t.artist=artists.get(t.artistId)||''; t.key=keys.get(t.keyId)||''; });
  return {tracks,lists,entries};
}

const mtof=m=>440*Math.pow(2,(m-69)/12);
async function renderDemo(spec){

  const out=oc.createGain(); out.gain.value=.75; out.connect(oc.destination);

  const tone=(t,type,f,pk,dec,lpf,lpe)=>{const o=oc.createOscillator();o.type=type;o.frequency.value=f;const fl=oc.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(lpf,t);fl.frequency.exponentialRampToValueAtTime(lpe,t+dec);fl.Q.value=4;const g=oc.createGain();env(g,t,pk,.004,dec);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+dec+.05);};

    const o=oc.createOscillator(); o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(46,t+.11);

/* A .tar bundle of the USB (Contents + PIONEER) is read in place: entries become file-like slices,

async function expandTar(file){
  const out=[], td=new TextDecoder(), N=file.size; let off=0, longName=null, paxPath=null, n=0, ended=false, bad=false;
  const bytes=async(a,b)=>new Uint8Array(await file.slice(a,b).arrayBuffer());

    const h=await bytes(off,off+512); if(h[0]===0){ ended=true; break; }
    { let sum=0; for(let k=0;k<512;k++) sum+=(k>=148&&k<156)?32:h[k]; const want=parseInt(td.decode(h.subarray(148,156)).replace(/[^0-7]/g,''),8); if(want!==sum){ bad=true; break; } }
    const str=(a,b)=>{ let e=a; while(e<b&&h[e]) e++; return td.decode(h.subarray(a,e)); };
    let size=0;
    if(h[124]&0x80){ for(let k=125;k<136;k++) size=size*256+h[k]; } else size=parseInt(str(124,136).trim(),8)||0;
    const type=h[156]?String.fromCharCode(h[156]):'0', ustar=str(257,262)==='ustar', prefix=ustar?str(345,500):'';
    const name=(prefix?prefix+'/':'')+str(0,100), dataOff=off+512;
    if(type==='L') longName=td.decode(await bytes(dataOff,dataOff+size)).replace(/\0+$/,'');
    else if(type==='x'){ const b=await bytes(dataOff,dataOff+size); let i=0;
      while(i<b.length){ let j=i; while(j<b.length&&b[j]!==32) j++; const L=parseInt(td.decode(b.subarray(i,j)),10); if(!L) break;
        const rec=td.decode(b.subarray(j+1,i+L-1)), eq=rec.indexOf('='); if(rec.slice(0,eq)==='path') paxPath=rec.slice(eq+1); i+=L; } }
    else if(type!=='g'){
      if(type==='0'||type==='7'){ const p=(paxPath||longName||name).replace(/^\.\//,''), base=p.split('/').pop();
        if(base&&!base.startsWith('._')&&!/(^|\/)__MACOSX\//.test(p)){ const o=dataOff, sz=size;

}
async function ingest(fileList){

  let add=Array.from(fileList||[]); if(!add.length){ libBusy=false; return; }

  if(add.some(isPart)){
    add.filter(isPart).forEach(f=>lib.parts.set(f.name,f)); add=add.filter(f=>!isPart(f));
    const ps=[...lib.parts.values()].sort((a,b)=>a.name.localeCompare(b.name)), blob=new Blob(ps);

    try{ const x=await expandTar(joined); x.forEach(f=>f._parts=true); x.meta.parts=ps.map(p=>p.name); lib.tar=x.meta; add=add.concat(x); }
    catch(e){ lib.tar={name:joined.name,size:joined.size,entries:0,pioneer:0,audio:0,cut:true,parts:ps.map(p=>p.name)}; }
  }
  const tars=add.filter(f=>/\.tar$/i.test(f.name));
  if(tars.length){ add=add.filter(f=>!/\.tar$/i.test(f.name));
    for(const t of tars){ try{ const x=await expandTar(t); lib.tar=x.meta; add=add.concat(x); }catch(e){ lib.tar={name:t.name,size:t.size,entries:0,pioneer:0,audio:0,cut:true}; } } }

    return c.find(f=>('/'+K(f.webkitRelativePath||f.name)).endsWith(pl))||(c.length===1?c[0]:null); };
  const sibling=(f,ext)=>{ const r=K(f.webkitRelativePath||''); return r?byRel.get(r.replace(/\.dat$/,ext))||null:null; };
  setLibStatus('파일 '+files.length.toLocaleString()+'개 확인 중…');

  const pdbF=files.find(f=>f.name.toLowerCase()==='export.pdb');
  try{
    if(pdbF){

        if(file) used.add(file);

/* ---- keys (Camelot wheel) & matching ---- */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11}, CAM_MAJ=[8,3,10,5,12,7,2,9,4,11,6,1];
function camelot(k){
  if(!k) return null; k=String(k).trim();
  let m=k.match(/^0?(\d{1,2})\s*([AaBb])$/); if(m){ const n=+m[1]; return n>=1&&n<=12?{n,l:m[2].toUpperCase()}:null; }
  m=k.match(/^([A-Ga-g])\s*([#♯b♭]?)\s*([a-zA-Z]*)$/); if(!m) return null;
  const suf=m[3].toLowerCase(); let minor;
  if(suf===''||suf==='maj'||suf==='major') minor=false; else if(suf==='m'||suf==='min'||suf==='minor') minor=true; else return null;
  const s=(NOTE[m[1].toUpperCase()]+(m[2]==='#'||m[2]==='♯'?1:m[2]?-1:0)+12)%12;
  return minor?{n:CAM_MAJ[(s+3)%12],l:'A'}:{n:CAM_MAJ[s],l:'B'};
}
const camStr=c=>c?c.n+c.l:'';
function keyOk(a,b){ if(!a||!b) return false; if(a.n===b.n) return true; if(a.l!==b.l) return false; const d=Math.abs(a.n-b.n); return d===1||d===11; }
function bpmOk(t,ref){ if(!t||!ref) return false; let r=t/ref; while(r>1.5) r/=2; while(r<.75) r*=2; return Math.abs(r-1)<=.06; }

function refDeck(){
  if(libTarget>=0){ const o=decks[1-libTarget]; if(o.track) return o; }
  const pl=decks.filter(d=>d.playing&&d.track);
  if(pl.length===1) return pl[0];
  if(pl.length===2){ const w=d=>mix.vol[d.i]*(d.i?Math.min(1,mix.xf*2):Math.min(1,(1-mix.xf)*2)); return w(pl[0])>=w(pl[1])?pl[0]:pl[1]; }
  return decks.find(d=>d.track)||null;
}

const strips=[0,1].map(i=>({el:$('w'+i),cache:new Map(),key:'',x:null}));
function renderTile(d,i,cv,k,ppd,Hd,dpr){
  const TW=TWD; cv.width=TW; cv.height=Hd;
  const g=cv.getContext('2d'), mid=Hd/2, tb=k*TW/ppd, te=(k+1)*TW/ppd, X=t=>(t-tb)*ppd, offs=cyclesFor(d,tb-1,te+1);
  if(d.loopOn) offs.forEach(o=>{ const x1=X(d.lin+o), x2=X(d.lout+o); if(x2<0||x1>TW) return; g.fillStyle=col.loopbg; g.fillRect(x1,0,x2-x1,Hd); g.fillStyle=col.loopln; g.fillRect(x1,0,2*dpr,Hd); g.fillRect(x2-2*dpr,0,2*dpr,Hd); });
  if(d.grid){ const gt=d.grid.t, gn=d.grid.n;
    offs.forEach(o=>{ for(let j=Math.max(0,beatAt(d,tb-o));j<gt.length;j++){ const x=X(gt[j]+o); if(x>TW) break; if(x<-2*dpr) continue; g.fillStyle=gn[j]===1?col.bar:col.line; g.fillRect(x,0,(gn[j]===1?2:1)*dpr,Hd); } }); }
  const w=d.wave, n=w.length/3, step=Math.max(2,Math.round(2*dpr)), cA=i?col.b:col.a, cB=i?col.b2:col.a2;
  for(let x=0;x<TW;x+=step){
    let t=tb+x/ppd; if(d.wrap) t=((t%d.dur)+d.dur)%d.dur; else if(t<0||t>=d.dur) continue;
    const b=Math.min(n-1,Math.floor(t*WR))*3, lo=w[b]/255*mid*.95, mi=w[b+1]/255*mid*.8, hi=w[b+2]/255*mid*.6;
    g.fillStyle=cA; g.fillRect(x,mid-lo,step-1,lo*2);
    g.fillStyle=cB; g.fillRect(x,mid-mi,step-1,mi*2);
    g.fillStyle=col.fg; g.fillRect(x,mid-hi,step-1,hi*2);
  }
  g.font='700 '+Math.round(10*dpr)+'px "Chakra Petch",sans-serif';
  offs.forEach(o=>{
    d.hot.forEach((h,j)=>{ if(!h) return; const x=X(h.t+o); if(x<-30*dpr||x>TW+30*dpr) return; g.fillStyle=h.color; g.fillRect(x-dpr,0,2*dpr,Hd); g.beginPath(); g.moveTo(x-7*dpr,0); g.lineTo(x+7*dpr,0); g.lineTo(x,9*dpr); g.fill(); g.fillText('ABCDEFGH'[j],x+4*dpr,Hd-5*dpr); });
    const cx=X(d.cue+o); if(cx>-10*dpr&&cx<TW+10*dpr){ g.fillStyle=col.hot; g.beginPath(); g.moveTo(cx-7*dpr,Hd); g.lineTo(cx+7*dpr,Hd); g.lineTo(cx,Hd-9*dpr); g.fill(); }
  });
}
function drawStrip(i){
  const d=decks[i], st=strips[i], c=st.el, [W,H,dpr]=sizeCanvas(c), g=c.getContext('2d');
  if(!d.wave){ if(st.x!==null){ g.clearRect(0,0,W,H); st.x=null; } return; }
  const ppd=W/zoom, key=d.ver+'|'+ppd.toFixed(3)+'|'+H+'|'+dpr;
  if(key!==st.key){ st.key=key; st.cache.clear(); st.x=null; }
  const x0=Math.round((vpos(d)-zoom/2)*ppd); if(x0===st.x) return; st.x=x0;
  g.clearRect(0,0,W,H);
  for(let k=Math.floor(x0/TWD),k1=Math.floor((x0+W)/TWD);k<=k1;k++){
    let cv=st.cache.get(k); if(!cv){ cv=document.createElement('canvas'); renderTile(d,i,cv,k,ppd,H,dpr); st.cache.set(k,cv); if(st.cache.size>24) st.cache.delete(st.cache.keys().next().value); }
    g.drawImage(cv,k*TWD-x0,0);
  }
}
/* Overview: static canvas redrawn only when cues/loop change; playhead and played shading are transforms. */
const ovs=[0,1].map(i=>({c:$('o'+i),past:$('op'+i),head:$('oh'+i),key:'',f:-1}));
function drawOverview(i){
  const d=decks[i], ov=ovs[i], c=ov.c;
  if(!d.wave){ if(ov.key){ ov.key=''; c.getContext('2d').clearRect(0,0,c.width,c.height); } return; }
  const [W,H,dpr]=sizeCanvas(c), key=d.ver+'|'+W+'|'+H;
  if(key!==ov.key){ ov.key=key; const g=c.getContext('2d'), n=d.wave.length/3, w=d.wave, cA=i?col.b:col.a, cB=i?col.b2:col.a2; g.clearRect(0,0,W,H);
    for(let x=0;x<W;x+=dpr){ const b0=Math.floor(x/W*n), b1=Math.max(b0+1,Math.floor((x+dpr)/W*n)); let lo=0,mi=0; for(let b=b0;b<b1;b++){ if(w[b*3]>lo)lo=w[b*3]; if(w[b*3+1]>mi)mi=w[b*3+1]; }
      const hl=lo/255*H, hm=mi/255*H*.75; g.fillStyle=cA; g.fillRect(x,H-hl,dpr,hl); g.fillStyle=cB; g.fillRect(x,H-hm,dpr,hm); }
    d.hot.forEach(h=>{ if(!h) return; g.fillStyle=h.color; g.fillRect(h.t/d.dur*W-dpr,0,2*dpr,H*.5); });
    if(d.loopOn){ g.fillStyle=col.loopln; g.fillRect(d.lin/d.dur*W,0,Math.max(2*dpr,(d.lout-d.lin)/d.dur*W),3*dpr); }
  }
  const f=Math.round(vpos(d)/d.dur*2000)/2000;
  if(f!==ov.f){ ov.f=f; ov.past.style.transform='scaleX('+f+')'; ov.head.style.transform='translateX('+(f*c._cw).toFixed(1)+'px)'; }
}
function phaseOf(d){ if(!d.grid||!d.buffer) return null; const p=vpos(d), k=beatAt(d,p); if(k<0) return null; return {beat:d.grid.n[k],frac:(p-d.grid.t[k])/beatLen(d,k)}; }

/* DOM writes are cached so the page only touches what actually changed. */
const setT=(el,s)=>{ if(el._t!==s){ el._t=s; el.textContent=s; } };
const els=[0,1].map(i=>({arm:$('arm'+i),plat:$('plat'+i),rfg:$('rfg'+i),rem:$('rem'+i),el:$('el'+i),deck:$('deck'+i),met:$('met'+i),segs:Array.from($('seg'+i).querySelectorAll('i'))}));
/* tonearm geometry (jog box 448px): pivot P, record centre C, arm length 218 to the stylus */
const ARM={px:424,py:28,cx:224,cy:224,L:218,rv:224*(1-2*.046)};
function armAngle(r){
  const {px,py,cx,cy,L}=ARM, dx=cx-px, dy=cy-py, D=Math.hypot(dx,dy), a=(L*L-r*r+D*D)/(2*D), h=Math.sqrt(Math.max(0,L*L-a*a));
  const ux=dx/D, uy=dy/D, mx=px+a*ux, my=py+a*uy, t1=[mx-h*uy,my+h*ux], t2=[mx+h*uy,my-h*ux], T=t1[1]>t2[1]?t1:t2;
  return Math.atan2(-(T[0]-px),T[1]-py)*180/Math.PI;
}
const ARM_IN=armAngle(ARM.rv*.955), ARM_OUT=armAngle(ARM.rv*.43);
const ndot=$('ndot'), needle=$('needle'); let needleW=0, nState='', lastClock='', fN=0;
function frame(){
  fN++;
  syncStep();
  decks.forEach((d,i)=>{
    const E=els[i], vp=vpos(d), p=pos(d);
    drawStrip(i); drawOverview(i);
    E.plat.style.transform='rotate('+((vp/ROT)*360%360).toFixed(1)+'deg)';
    const pr=d.dur?Math.round(vp/d.dur*100):0; if(E._pr!==pr){ E._pr=pr; E.rfg.style.strokeDashoffset=String(100-pr); }
    const aa=d.buffer?(ARM_IN+(ARM_OUT-ARM_IN)*clamp(vp/d.dur,0,1)):-5;
    if(E._aa===undefined||Math.abs(aa-E._aa)>.15){ E._aa=aa; E.arm.setAttribute('transform','rotate('+aa.toFixed(2)+' 424 28)'); }
    if(d.buffer){ setT(E.rem,'-'+fmt(d.dur-p)); setT(E.el,fmt(p)+(d.wrap?' · 루프':' / '+fmt(d.dur))); }
    const warn=!d.wrap&&d.playing&&d.dur-p<30, blink=warn&&Math.floor(performance.now()/400)%2===0, ws=(warn?1:0)+(blink?2:0);
    if(E._w!==ws){ E._w=ws; E.deck.classList.toggle('warn',warn); E.deck.classList.toggle('blink',blink); }
    if(!LITE||fN%2===0){ let lv=0; if(ctx&&d.nodes){ const b=d.nodes.buf; d.nodes.an.getFloatTimeDomainData(b); let s=0; for(let k=0;k<b.length;k+=4) s+=b[k]*b[k]; lv=Math.min(1,Math.sqrt(s/(b.length/4))*3.2); }
      d.lvl=Math.max(lv,d.lvl*.82); const lq=Math.round(d.lvl*40); if(E._l!==lq){ E._l=lq; E.met.style.transform='translateY('+(-lq*2.5)+'%)'; } }
    const ph=phaseOf(d), bt=ph?ph.beat:0; if(E._b!==bt){ E._b=bt; E.segs.forEach((el,k)=>el.classList.toggle('on',bt===k+1)); }
  });
  const pa=decks[0].playing?phaseOf(decks[0]):null, pb=decks[1].playing?phaseOf(decks[1]):null;
  if(!needleW) needleW=needle.offsetWidth;
  let st='';
  if(pa&&pb){ let df=pa.frac-pb.frac; df-=Math.round(df); st=Math.round(df*needleW)+'|'+(Math.abs(df)<.04?1:0)+'|'+(df>=0?'+':'')+df.toFixed(2); }
  if(st!==nState){ nState=st; const s=st.split('|');
    ndot.style.transform=st?'translateX('+s[0]+'px)':''; needle.classList.toggle('match',s[1]==='1'); setT($('ntx'),st?s[2]+' 박':''); }
  const now=new Date(), ck=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'); if(ck!==lastClock){ lastClock=ck; $('clock').textContent=ck; }
  requestAnimationFrame(frame);
}

/* ---- settings: light mode & Bluetooth delay ---- */
function uiPerf(){ const b=$('perfBtn'); b.classList.toggle('on',LITE); b.textContent=LITE?'켜짐':'꺼짐'; decks.forEach(d=>d.ver++); }
$('perfBtn').addEventListener('click',()=>{ LITE=!LITE; try{localStorage.setItem('tdj.lite',LITE?'1':'0');}catch(e){} uiPerf(); });
const LATS=[0,50,100,150,200,250,300,400];
$('latSeg').innerHTML=LATS.map(v=>'<button data-v="'+v+'">'+v+'</button>').join('');
function uiLat(){ $('latSeg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===VLAT)); }
$('latSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; VLAT=+b.dataset.v; try{localStorage.setItem('tdj.vlat',String(VLAT));}catch(e){} uiLat(); });
function closeSettings(){ $('sett').hidden=true; $('setBtn').classList.remove('on'); }
$('setBtn').addEventListener('click',()=>{ const h=!$('sett').hidden; if(h) closeSettings(); else { $('sett').hidden=false; $('setBtn').classList.add('on'); } });
stage.addEventListener('pointerdown',e=>{ if(!$('sett').hidden&&!e.target.closest('#sett,#setBtn')) closeSettings(); },true);
uiPerf(); uiLat(); uiSync(); decks.forEach(uiPads);
/* ================= boot ================= */
decks.forEach(d=>{ uiPitch(d); uiTransport(d); uiHot(d); });
buildViews();
demoTracks.forEach((t,i)=>{ $('name'+i).textContent='데모 트랙 만드는 중…'; });
Promise.all(demoSpecs.map(renderDemo)).then(bufs=>{ bufs.forEach((b,k)=>demoBufs[k]=b); demoTracks.forEach((t,i)=>loadToDeck(i,t)); })
  .catch(()=>decks.forEach(d=>{ $('name'+d.i).textContent='탐색에서 곡을 불러오세요'; }));
requestAnimationFrame(frame);
window.__dj={parsePdb,parseAnlz,ingest,lib:()=>lib};
})();
</script>
